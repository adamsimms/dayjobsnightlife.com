name: CI

on:
  push:
    branches: [master, main, cursor/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Bedrock dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/app/themes/dayjobsnightlife/package-lock.json

      - name: Install theme dependencies
        working-directory: web/app/themes/dayjobsnightlife
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Lint theme JavaScript
        working-directory: web/app/themes/dayjobsnightlife
        run: npm run lint:js

      - name: Build theme assets
        working-directory: web/app/themes/dayjobsnightlife
        run: npm run build

      - name: Lint PHP
        run: composer lint
