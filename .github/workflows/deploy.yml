name: Deploy Theme

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-theme-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install theme production dependencies
        working-directory: web/app/themes/dayjobsnightlife
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/app/themes/dayjobsnightlife/package-lock.json

      - name: Build theme assets
        working-directory: web/app/themes/dayjobsnightlife
        run: |
          npm ci
          npm run build

      - name: Deploy theme via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER }}
          port: 22
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: ./web/app/themes/dayjobsnightlife/
          remote_path: ${{ secrets.SFTP_THEME_PATH }}
          sftpArgs: -o ConnectTimeout=30 -o StrictHostKeyChecking=no
          rsyncArgs: >-
            --exclude=.git
            --exclude=node_modules
            --exclude=resources
            --exclude=.budfiles
            --exclude=bud.config.js
            --exclude=package.json
            --exclude=package-lock.json
            --exclude=jsconfig.json
            --exclude=.eslintrc.json
            --exclude=.nvmrc
            --exclude=tailwind.config.js
            --exclude=yarn.lock
